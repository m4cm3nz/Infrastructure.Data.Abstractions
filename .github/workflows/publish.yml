name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # required for NuGet Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Verify tag matches csproj version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' Infrastructure.Data.Abstractions/Infrastructure.Data.Abstractions.csproj)
          echo "Tag version:    $TAG_VERSION"
          echo "Csproj version: $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "ERROR: tag '$TAG_VERSION' does not match csproj version '$CSPROJ_VERSION'"
            exit 1
          fi

      - name: Pack
        run: dotnet pack Infrastructure.Data.Abstractions/Infrastructure.Data.Abstractions.csproj -c Release --no-build -o ./nupkg

      - name: NuGet login
        uses: NuGet/login@v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
